name: TEST-DEPLOY-01 Separated Main and Planner V2

on:
  push:
    branches: [fix/deploy-gate-2-separated-pages]
    paths:
      - .github/workflows/test-deploy-01-deterministic-pages.yml
      - scripts/prepare-separated-pages.mjs
      - tests/separated-pages.test.mjs
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character authorized Neuaufbau SHA
        required: true
        type: string
      block_id:
        description: Visible development block ID
        required: true
        type: string
      test_build:
        description: Visible test build number
        required: true
        type: string
      publish:
        description: Publish only after Pages source is GitHub Actions
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-test-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify separation contracts
        run: node --test tests/separated-pages.test.mjs
      - name: Prepare exact combined artifact
        env:
          TEST_SHA: ${{ inputs.commit_sha || 'd68affb043024f544cb104666f6f93d2c0e52866' }}
          BLOCK_ID: ${{ inputs.block_id || 'Paket-H' }}
          TEST_BUILD: ${{ inputs.test_build || '6' }}
        run: node scripts/prepare-separated-pages.mjs _site "$TEST_SHA" "$BLOCK_ID" "$TEST_BUILD"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse competing branch publishing
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.getPages(context.repo);
            if (data.build_type !== 'workflow') {
              core.setFailed('Set Settings > Pages > Source to GitHub Actions before deploying.');
            }
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
