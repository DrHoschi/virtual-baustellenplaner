name: TEST-DEPLOY-01 Deterministic Pages Test Deployment

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character commit SHA to deploy"
        required: true
        type: string
      block_id:
        description: "Visible development block ID, e.g. PROJECT-UI-03C"
        required: true
        type: string
      test_build:
        description: "Visible test build number, e.g. 1"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-test-deployment"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested SHA format
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "commit_sha must be an exact 40-character SHA"
            exit 1
          fi

      - name: Checkout exact authorized SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify checkout identity
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$REQUESTED_SHA" ]; then
            echo "Requested SHA: $REQUESTED_SHA"
            echo "Checkout SHA:  $ACTUAL_SHA"
            exit 1
          fi
          echo "Verified checkout SHA: $ACTUAL_SHA"

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '_site/' \
            ./ _site/

      - name: Generate authoritative build identity
        env:
          BLOCK_ID: ${{ inputs.block_id }}
          TEST_BUILD: ${{ inputs.test_build }}
          DEPLOY_SHA: ${{ inputs.commit_sha }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const blockId = process.env.BLOCK_ID;
          const testBuild = process.env.TEST_BUILD;
          const sha = process.env.DEPLOY_SHA;
          const buildInfo = {
            blockId,
            testBuild,
            sha,
            shortSha: sha.slice(0, 8),
            deployedAt: new Date().toISOString()
          };
          fs.writeFileSync('_site/build-info.json', JSON.stringify(buildInfo, null, 2) + '\n');
          NODE

      - name: Verify embedded build identity
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          EXPECTED_BLOCK_ID: ${{ inputs.block_id }}
          EXPECTED_TEST_BUILD: ${{ inputs.test_build }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('_site/build-info.json', 'utf8'));
          const expected = {
            sha: process.env.EXPECTED_SHA,
            blockId: process.env.EXPECTED_BLOCK_ID,
            testBuild: process.env.EXPECTED_TEST_BUILD
          };
          for (const [key, value] of Object.entries(expected)) {
            if (info[key] !== value) {
              throw new Error(`Build identity mismatch for ${key}: ${info[key]} != ${value}`);
            }
          }
          if (info.shortSha !== expected.sha.slice(0, 8)) {
            throw new Error('Build identity shortSha mismatch');
          }
          console.log(`Verified build identity: ${info.blockId} · TESTBUILD ${info.testBuild} · ${info.shortSha}`);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
