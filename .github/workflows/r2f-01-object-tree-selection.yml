name: R2F-01 Object Tree Selection Gate

on:
  push:
    branches:
      - feature/R2F-01-workarea-navigation-object-tree
  pull_request:
  workflow_dispatch:

jobs:
  r2f-01-object-tree-selection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS Syntax Check
        run: node scripts/syntax-check.mjs

      - name: Import Graph Check
        run: node scripts/import-graph-check.mjs

      - name: Install Playwright Test
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install --no-save @playwright/test@1.50.1

      - name: Install Chromium
        run: npx playwright install chromium

      - name: R2F-01 Object Tree Selection Acceptance
        run: npx playwright test tests/r2f-01-object-tree-selection.spec.js
