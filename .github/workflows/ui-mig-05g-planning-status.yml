name: UI-MIG-05G Planning Status Gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  planning-status-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS Syntax Check
        run: node scripts/syntax-check.mjs

      - name: Import Graph Check
        run: node scripts/import-graph-check.mjs

      - name: Install Playwright Test
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install --no-save @playwright/test@1.50.1

      - name: Install Chromium
        run: npx playwright install chromium

      - name: UI-MIG-05F Regression
        run: npx playwright test tests/ui-mig-05f-planning-context.spec.js

      - name: UI-MIG-05G Planning Status Acceptance
        run: npx playwright test tests/ui-mig-05g-planning-status.spec.js
