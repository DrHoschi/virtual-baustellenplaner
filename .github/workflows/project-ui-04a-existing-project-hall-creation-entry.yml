name: PROJECT-UI-04A Existing Project Hall Creation Entry

on:
  push:
    branches:
      - feature/project-ui-04a-existing-project-hall-creation-entry
  pull_request:
  workflow_dispatch:

jobs:
  project-ui-04a-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.50.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: PROJECT-UI-04A acceptance
        run: npx playwright test tests/project-ui-04a-existing-project-hall-creation-entry.spec.js
