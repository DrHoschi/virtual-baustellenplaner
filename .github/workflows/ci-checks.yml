name: CI Checks (Syntax + Imports + Manifest + UI Wiring)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---------------------------
      # 1) Syntax Check
      # ---------------------------
      - name: JS Syntax Check
        run: node scripts/syntax-check.mjs

      # ---------------------------
      # 2) Import Graph Check
      # ---------------------------
      - name: Import Graph Check
        run: node scripts/import-graph-check.mjs

      # ---------------------------
      # 3) Manifest / Wiring Check
      # ---------------------------
      - name: Manifest Integrity Check
        run: node scripts/manifest-check.mjs

      # ---------------------------
      # 4) UI Wiring E2E (Playwright)
      #
      # WICHTIG:
      # - KEIN "npm ci", weil dieses Repo (noch) kein package-lock.json hat.
      # - Wir nutzen "npx -y playwright@..." um Playwright on-the-fly zu holen.
      # ---------------------------
      - name: Install Playwright Test (minimal)
        run: |
          npm install --no-save @playwright/test@1.50.1

      - name: Install Playwright Browsers
        run: |
          npx playwright install chromium

      - name: UI Wiring E2E
        run: |
          npx playwright test tests/ui-wiring.spec.js
      
      - name: Smoke Tests
        run: npx playwright test tests/00-boot-smoke.spec.js tests/smoke.spec.js
