name: TECH-WA-FREEZE-01C Mobile Viewer Stability Gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mobile-viewer-stability-probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS Syntax Check
        run: node scripts/syntax-check.mjs

      - name: Import Graph Check
        run: node scripts/import-graph-check.mjs

      - name: Install Playwright Test
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install --no-save @playwright/test@1.50.1

      - name: Install Chromium
        run: npx playwright install chromium

      - name: UI-MIG-05G Regression
        run: npx playwright test tests/ui-mig-05g-planning-status.spec.js

      - name: TECH-WA-FREEZE-01B.1 Regression
        run: npx playwright test tests/tech-wa-freeze-01b1-instrumentation.spec.js

      - name: TECH-WA-FREEZE-01B.2 Regression
        run: npx playwright test tests/tech-wa-freeze-01b2-heartbeats.spec.js

      - name: TECH-WA-FREEZE-01B.3 Regression
        run: npx playwright test tests/tech-wa-freeze-01b3-raf-abort.spec.js

      - name: TECH-WA-FREEZE-01C Browser Height Stability Acceptance
        run: npx playwright test tests/tech-wa-freeze-01c-mobile-viewer-stability.spec.js
