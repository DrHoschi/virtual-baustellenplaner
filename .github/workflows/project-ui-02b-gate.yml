name: PROJECT-UI-02B Test Gate

on:
  push:
    paths:
      - ".github/workflows/project-ui-02b-gate.yml"
  workflow_dispatch:

jobs:
  project-ui-02b-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact PROJECT-UI-02B head
        uses: actions/checkout@v4
        with:
          ref: d0611619aa7f0b682b492f967a6ceacb8f54a682

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS Syntax Check
        run: node scripts/syntax-check.mjs

      - name: Import Graph Check
        run: node scripts/import-graph-check.mjs

      - name: PROJECT-UI-02A Project Workspace Contract
        run: node scripts/project-workspace-contract-check.mjs

      - name: PROJECT-UI-02B Project Management Contract
        run: node scripts/project-ui-02b-management-contract-check.mjs

      - name: Install Playwright Test
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install --no-save @playwright/test@1.50.1

      - name: Install Chromium
        run: npx playwright install chromium

      - name: UI-MIG-04A Regression
        run: npx playwright test tests/ui-mig-04a-project-workspace.spec.js --reporter=line

      - name: UI-MIG-04B Project Workspace Completion Acceptance
        run: npx playwright test tests/ui-mig-04b-project-workspace-completion.spec.js --reporter=line

      - name: PROJECT-UI-02B Browser Regression
        run: npx playwright test tests/project-ui-02b-project-management-entry.spec.js --reporter=line
