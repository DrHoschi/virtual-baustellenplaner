<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />

  <!--
    =====================================================================
    DATEI: /index.html
    VERSION: v1.4.0-mobile-header-clean
    STAND: 2026-05-16

    ZWECK:
    - Globale App-Shell des Baustellenplaners.
    - Desktop: Menü links, Hauptbereich rechts.
    - Mobile: kompakte Kopfzeile mit genau einer Zeile:
        [☰ Menü] [Aktives Modul] [Debug]

    WICHTIGER CLEANUP-STAND:
    - Header-/Mobile-/Debug-CSS liegt jetzt sauber in ui/css/ui-shell.css.
    - Header-/Mobile-/Snapshot-JS liegt jetzt sauber in main.js.
    - app/ui/menu.js erzeugt keinen zweiten Mobile-Menü-Button mehr.
    - Debug-/Snapshot-Funktionen bleiben vollständig erhalten.
  -->

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Baustellenplaner</title>

  <!-- UI Core (Panels/Toolbar/Forms) -->
  <link rel="stylesheet" href="./ui/css/ui-core.css?v=347">

  <!-- UI Shell (Layout, Menü, Mobile-Header, Debug/Snapshot) -->
  <link rel="stylesheet" href="./ui/css/ui-shell.css?v=347">

  <!-- Projekt-Assets -->
  <link rel="stylesheet" href="./ui/css/ui-projectassets.css?v=347">

  <!-- Workarea -->
  <link rel="stylesheet" href="./ui/css/ui-workarea.css?v=347">
</head>

<body>
  <div class="app">

    <!--
      =====================================================================
      GLOBALER MOBILE-HEADER
      =====================================================================
      Desktop: per CSS unsichtbar.
      Mobile: kompakte Zeile:
        [☰ Menü] [Aktives Modul] [Debug]

      Das echte aktive Modul bleibt weiterhin #active.
      main.js spiegelt den Text nach #mobileActiveValue.
    -->
    <header class="mobile-shellbar" aria-label="Mobile Kopfzeile">
      <button
        id="btnMobileMenu"
        class="mobile-shellbar__btn"
        type="button"
        aria-expanded="false"
        aria-controls="menu"
      >
        ☰ Menü
      </button>

      <div class="mobile-shellbar__active" aria-label="Aktives Modul">
        <div class="mobile-shellbar__active-label">Aktives Modul</div>
        <div id="mobileActiveValue" class="mobile-shellbar__active-value">(lädt...)</div>
      </div>

      <button
        id="btnMobileDebug"
        class="mobile-shellbar__btn"
        type="button"
        aria-expanded="false"
        aria-controls="debugTools snapshotWrap"
      >
        Debug
      </button>
    </header>

    <!--
      =====================================================================
      HAUPTMENÜ
      =====================================================================
      Desktop: linke Spalte.
      Mobile: über den Kopfzeilen-Button als Overlay sichtbar.
    -->
    <aside id="menu" aria-label="Menü"></aside>

    <main class="main">

      <!--
        =====================================================================
        AKTIVES MODUL - DESKTOP / TABLET
        =====================================================================
        Auf Mobile wird diese Card ausgeblendet und durch die kompakte
        Kopfzeile ersetzt.
      -->
      <div id="activeCard" class="card">
        <div class="subtitle">Aktives Modul</div>
        <div id="active" class="subtitle active-module-text">(lädt...)</div>
      </div>

      <!--
        =====================================================================
        STORE SNAPSHOT HEADER / TOOLS
        =====================================================================
        Desktop: normal sichtbar.
        Mobile: nur sichtbar, wenn oben "Debug" gedrückt wurde.
      -->
      <div id="debugTools" class="bp-debug-tools">
        <div class="subtitle bp-debug-title">Store Snapshot</div>

        <label class="subtitle bp-debug-filter-label">
          Filter:
          <select id="snapshotFilter" class="bp-btn bp-btn-secondary bp-debug-filter">
            <option value="__ALL__" selected>ALL</option>
            <option value="app">app</option>
            <option value="project">project</option>
            <option value="ui">ui</option>
            <option value="plugins">plugins</option>
            <option value="registry">registry</option>
          </select>
        </label>

        <button id="btnCopySnapshot" class="bp-btn bp-btn-secondary bp-debug-copy" type="button">
          Copy
        </button>

        <button id="btnDownloadSnapshot" class="bp-btn bp-btn-secondary" type="button">
          Export JSON
        </button>

        <button id="btnToggleSnapshot" class="bp-btn bp-btn-secondary" type="button">
          Snapshot ausblenden
        </button>
      </div>

      <!--
        =====================================================================
        AKTIVES PANEL / VIEW
        =====================================================================
        Hier rendert der Loader das aktive Modul, z. B. Workarea.
      -->
      <section id="view" class="card" aria-label="Aktives Modul"></section>

      <!--
        =====================================================================
        STORE SNAPSHOT BODY
        =====================================================================
        Bleibt erhalten, aber auf Mobile nur über Debug sichtbar.
      -->
      <div id="snapshotWrap" aria-label="Store Snapshot">
        <pre id="snapshot"></pre>
      </div>
    </main>
  </div>

  <!--
    Mobile Drag Stability ist ab v2.3 DIREKT in ui/panels/WorkareaPanel.js integriert.
    Wichtig: Kein externes workarea-mobile-drag-stability.v2.js mehr laden,
    damit alte Prototype-Patches nicht zusätzlich gegen die echten Handler laufen.
  -->
  
  <!--
    main.js startet die App und enthält die mobile Header-/Debug-Logik.
    Kein Inline-JS mehr in index.html, damit die Shell sauber wartbar bleibt.
  -->
  <script type="module" src="./main.js?v=347"></script>
</body>
</html>
