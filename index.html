<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />

  <!--
    =====================================================================
    DATEI: /index.html
    VERSION: v1.4.8-structure-tree-detail-editor-hardcut-nopersist-v6
    STAND: 2026-05-20

    ZWECK:
    - Globale App-Shell des Baustellenplaners.
    - Desktop: Menü links, Hauptbereich rechts.
    - Mobile: kompakte Kopfzeile mit genau einer Zeile:
        [☰ Menü] [Aktives Modul] [Debug]

    PATCH v1.4.5:
    - Strukturbaum-Patches eingebunden: Live-Gruppierung, Untergruppen, NoScroll-Guard, Detail-Editor und Live-Save-Hotfix.
    - PATCH_workarea_structure_tree_live_grouping_v1 eingebunden:
        /core/workarea-structure-tree-live-grouping.v1.js
    - Strukturbaum gruppiert live nach Ortbereich/Fördergruppe.
    - Debug-/Snapshot-Funktionen bleiben vollständig erhalten.
  -->

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Baustellenplaner</title>

  <!-- UI Core (Panels/Toolbar/Forms) -->
  <link rel="stylesheet" href="./ui/css/ui-core.css?v=347">

  <!-- UI Shell (Layout, Menü, Mobile-Header, Debug/Snapshot) -->
  <link rel="stylesheet" href="./ui/css/ui-shell.css?v=347">

  <!-- Projekt-Assets -->
  <link rel="stylesheet" href="./ui/css/ui-projectassets.css?v=347">

  <!-- Workarea -->
  <link rel="stylesheet" href="./ui/css/ui-workarea.css?v=347">
</head>

<body>
  <div class="app">

    <!--
      =====================================================================
      GLOBALER MOBILE-HEADER
      =====================================================================
      Desktop: per CSS unsichtbar.
      Mobile: kompakte Zeile:
        [☰ Menü] [Aktives Modul] [Debug]

      Das echte aktive Modul bleibt weiterhin #active.
      main.js spiegelt den Text nach #mobileActiveValue.
    -->
    <header class="mobile-shellbar" aria-label="Mobile Kopfzeile">
      <button
        id="btnMobileMenu"
        class="mobile-shellbar__btn"
        type="button"
        aria-expanded="false"
        aria-controls="menu"
      >
        ☰ Menü
      </button>

      <div class="mobile-shellbar__active" aria-label="Aktives Modul">
        <div class="mobile-shellbar__active-label">Aktives Modul</div>
        <div id="mobileActiveValue" class="mobile-shellbar__active-value">(lädt...)</div>
      </div>

      <button
        id="btnMobileDebug"
        class="mobile-shellbar__btn"
        type="button"
        aria-expanded="false"
        aria-controls="debugTools snapshotWrap"
      >
        Debug
      </button>
    </header>

    <!--
      =====================================================================
      HAUPTMENÜ
      =====================================================================
      Desktop: linke Spalte.
      Mobile: über den Kopfzeilen-Button als Overlay sichtbar.
    -->
    <aside id="menu" aria-label="Menü"></aside>

    <main class="main">

      <!--
        =====================================================================
        AKTIVES MODUL - DESKTOP / TABLET
        =====================================================================
        Auf Mobile wird diese Card ausgeblendet und durch die kompakte
        Kopfzeile ersetzt.
      -->
      <div id="activeCard" class="card">
        <div class="subtitle">Aktives Modul</div>
        <div id="active" class="subtitle active-module-text">(lädt...)</div>
      </div>

      <!--
        =====================================================================
        STORE SNAPSHOT HEADER / TOOLS
        =====================================================================
        Desktop: normal sichtbar.
        Mobile: nur sichtbar, wenn oben "Debug" gedrückt wurde.
      -->
      <div id="debugTools" class="bp-debug-tools">
        <div class="subtitle bp-debug-title">Store Snapshot</div>

        <label class="subtitle bp-debug-filter-label">
          Filter:
          <select id="snapshotFilter" class="bp-btn bp-btn-secondary bp-debug-filter">
            <option value="__ALL__" selected>ALL</option>
            <option value="app">app</option>
            <option value="project">project</option>
            <option value="ui">ui</option>
            <option value="plugins">plugins</option>
            <option value="registry">registry</option>
          </select>
        </label>

        <button id="btnCopySnapshot" class="bp-btn bp-btn-secondary bp-debug-copy" type="button">
          Copy
        </button>

        <button id="btnDownloadSnapshot" class="bp-btn bp-btn-secondary" type="button">
          Export JSON
        </button>

        <button id="btnToggleSnapshot" class="bp-btn bp-btn-secondary" type="button">
          Snapshot ausblenden
        </button>
      </div>

      <!--
        =====================================================================
        AKTIVES PANEL / VIEW
        =====================================================================
        Hier rendert der Loader das aktive Modul, z. B. Workarea.
      -->
      <section id="view" class="card" aria-label="Aktives Modul"></section>

      <!--
        =====================================================================
        STORE SNAPSHOT BODY
        =====================================================================
        Bleibt erhalten, aber auf Mobile nur über Debug sichtbar.
      -->
      <div id="snapshotWrap" aria-label="Store Snapshot">
        <pre id="snapshot"></pre>
      </div>
    </main>
  </div>

  <!--
    ============================================================================
    PATCH: Workarea Mobile Drag Stability v2
    POSITION:
    - nach Crash Recorder / Debug Recorder
    - vor main.js / App-Start
    ============================================================================
  -->
  <script type="module" src="./core/workarea-mobile-drag-stability.v2.js?v=2"></script>
  <script type="module" src="./core/workarea-assembly-scene-binding.v1.js?v=singlefire1"></script>

  <!-- PATCH_workarea_assembly_insert_and_variant_panel_v1 -->
  <!-- Einfügen im Bereich deiner bestehenden <script type="module"> Includes, am besten nach Crash Recorder / Drag Guard. -->
  <script type="module" src="./core/workarea-assembly-insert-and-variant-panel.v1.js?v=singlefire1"></script>

  <!--
    ============================================================================
    PATCH: Workarea Structure Tree Live Grouping v1
    POSITION:
    - nach den Workarea/Assembly-Patches
    - vor Projekt Transfer und vor main.js

    Funktion:
    - Projektstruktur gruppiert live nach aktuellen Feldern:
      config.location/config.conveyorGroup/eplan.location/location usw.
    - Neue Orte wie +C und +D erscheinen automatisch.
    - Auswahlmarkierung bleibt erhalten.
    ============================================================================
  -->
  <script type="module" src="./core/workarea-structure-tree-live-grouping.v1.js?v=1"></script>

  <!--
    ============================================================================
    PATCH: Workarea Structure Tree Component Nodes v1
    POSITION:
    - direkt nach Live Grouping v1
    - vor Projekt Transfer und vor main.js

    Funktion:
    - Unter jedem Objekt erscheinen Baugruppen-Untergruppen wie Motor, MOVIFIT,
      Sensorik, Wartung/Sicherheit, Ports und Stückliste.
    - Klick auf einen Unterknoten öffnet rechts eine gezielte Detailkarte.
    ============================================================================
  -->
  <script type="module" src="./core/workarea-structure-tree-component-nodes.v1.js?v=1"></script>

  <!--
    ============================================================================
    HOTFIX: Workarea Structure Tree Selection Sync No Scroll v1
    POSITION:
    - direkt nach Component Nodes v1
    - vor Projekt Transfer und vor main.js

    Funktion:
    - Viewer-Auswahl synchronisiert den Strukturbaum weiter.
    - Elternknoten werden geöffnet und der Eintrag wird markiert.
    - Der linke Baum springt/scrollt dabei NICHT mehr automatisch zum Objekt.
    ============================================================================
  -->
  <script type="module" src="./core/workarea-structure-tree-selection-sync-noscroll.v1.js?v=1"></script>
  <script type="module" src="./core/workarea-structure-tree-hard-noscroll-guard.v2.js?v=1"></script>
  <script type="module" src="./core/workarea-structure-tree-detail-editor.v1.js?v=1"></script>
<script type="module" src="./core/workarea-structure-tree-detail-editor-stability-clean.v5.js?v=5"></script>
<script type="module" src="./core/workarea-structure-tree-detail-editor-hardcut-nopersist.v6.js?v=6"></script>
<!--
    ============================================================================
    PATCH: Projekt Transfer v1
    POSITION:
    - nach Mobile Drag Stability
    - vor main.js / App-Start

    Funktion:
    - Export/Import-Dialog für Projekt, Assets, Workarea-Szene, Settings/UI.
    - Echte ZIP-Erzeugung ohne externe Bibliothek.
    ============================================================================
  -->
  <script type="module" src="./core/project-transfer.v1.js?v=1"></script>

  <!--
    main.js startet die App und enthält die mobile Header-/Debug-Logik.
    Kein Inline-JS mehr in index.html, damit die Shell sauber wartbar bleibt.
  -->
  <script type="module" src="./main.js?v=348"></script>
  <script type="module" src="./core/workarea-structure-tree-detail-editor-save-quarantine.v7.js?v=7"></script>
  <script type="module" src="./core/workarea-ui-tab-stability.v8.js?v=8"></script>

</body>
</html>
