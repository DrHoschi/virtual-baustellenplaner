<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2050" viewBox="0 0 1400 2050">
<rect width="1400" height="2500" fill="#f2f4f7"/>
<text x="70" y="75" font-family="Arial" font-size="36" font-weight="700" fill="#17202a">BAUSTELLENPLANER · WIREFRAME V0 · HOCHKANT</text>
<text x="70" y="120" font-family="Arial" font-size="23" fill="#52606d">Ein touch-orientiertes Layoutsystem für iPhone und iPad hochkant</text>
<defs><style>.phone{fill:#18232d}.screen{fill:#fff}.nav{fill:#243746}.card{fill:#f0f3f6;stroke:#d0d8df;stroke-width:2}.blue{fill:#d8e9f8;stroke:#316b9b;stroke-width:2}.txt{font-family:Arial;fill:#24313c}.white{font-family:Arial;fill:#fff}.h{font-size:22px;font-weight:700}.s{font-size:17px}.xs{font-size:14px}</style></defs>
<!-- storyboard descriptions -->
<text x="70" y="195" class="txt h">1 · Projekteinstieg</text><text x="70" y="228" class="txt s">Projektkarten, Suche und Neuanlage in einer klaren Einspalte</text>
<text x="505" y="195" class="txt h">2 · Bereich festlegen</text><text x="505" y="228" class="txt s">Ganze Halle oder Ausschnitt; Vorschau bleibt gut bedienbar</text>
<text x="940" y="195" class="txt h">3 · Planung</text><text x="940" y="228" class="txt s">Planfläche groß; Werkzeuge/Eigenschaften als aufrufbare Sheets</text>
