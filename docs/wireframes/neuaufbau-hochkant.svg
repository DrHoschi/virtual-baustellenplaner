<rect x="960" y="891" width="335" height="60" rx="9" class="card"/><text x="979" y="927" class="txt xs">＋ Platzieren    ⌁ Zeichnen    ⋯ Mehr</text>
<rect x="960" y="965" width="335" height="72" rx="10" class="blue"/><text x="979" y="994" class="txt s">Objekte · Layer · Eigenschaften</text><text x="979" y="1020" class="txt xs">Zum Bearbeiten antippen</text>
<!-- principles -->
<rect x="55" y="1170" width="1275" height="425" rx="20" fill="#fff" stroke="#bbc5cf" stroke-width="3"/>
<text x="90" y="1227" class="txt h">Touch-Regeln für Hochkant</text>
<text x="95" y="1280" class="txt s">• Planfläche nutzt die verfügbare Höhe; Bedienleisten bleiben erreichbar.</text>
<text x="95" y="1325" class="txt s">• Objektbaum, Layer und Eigenschaften öffnen bei Bedarf als Sheet statt als enge Sidebar.</text>
<text x="95" y="1370" class="txt s">• Aktive Höhenebene und Speicherstatus bleiben im Planmodus direkt sichtbar.</text>
<text x="95" y="1415" class="txt s">• Dieselbe Projekt-/Raumlogik wie im breiten Layout; keine zweite Datenwelt.</text>
<text x="95" y="1460" class="txt s">• iPhone zunächst nur Hochkant; Querformat ist nicht Teil dieses ersten Wireframes.</text>
<text x="95" y="1525" class="txt xs">Nur Wireframe: noch keine verbindlichen Maße, Breakpoints, Login- oder Autosave-Regeln.</text>
<text x="70" y="1658" class="txt h">Was beide Layouts teilen</text>
<rect x="55" y="1690" width="1275" height="240" rx="18" fill="#e9eef2"/>
<text x="90" y="1750" class="txt s">• Projekt → Baustellenbereich → Workarea ist derselbe verständliche Einstieg.</text>
<text x="90" y="1795" class="txt s">• Raum, Objekte, Höhe und Sicht-/Fachlayer sind gemeinsame Projektinformationen.</text>
<text x="90" y="1840" class="txt s">• Mechanik/Elektrik/Kamera hängen als optionale Module an derselben Workarea.</text>
<text x="90" y="1885" class="txt s">• Spätere 3D-/Seiten-/Schnittansichten lesen dieselben räumlichen Objektdaten.</text>
<text x="70" y="1980" class="txt xs">Wireframe V0 · Fachliche Abstimmung vor Datenvertrag und Implementierung</text>
</svg>