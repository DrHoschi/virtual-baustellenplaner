<rect x="490" y="260" width="405" height="850" rx="42" class="phone"/><rect x="507" y="282" width="371" height="806" rx="28" class="screen"/><rect x="620" y="290" width="145" height="20" rx="10" fill="#18232d"/>
<rect x="507" y="326" width="371" height="62" class="nav"/><text x="528" y="365" class="white s">← Werkhalle Nord</text><text x="528" y="435" class="txt h">Baustellenbereich</text><text x="528" y="467" class="txt xs">Welche Fläche wird geplant?</text>
<rect x="528" y="490" width="329" height="70" rx="10" class="blue"/><text x="548" y="520" class="txt h">Ganze Halle</text><text x="548" y="544" class="txt xs">Die komplette Hallenfläche</text>
<rect x="528" y="575" width="329" height="70" rx="10" class="card"/><text x="548" y="605" class="txt h">Hallenausschnitt</text><text x="548" y="629" class="txt xs">Teilfläche im Hallenbezug</text>
<rect x="528" y="663" width="329" height="250" rx="10" fill="#fafbfc" stroke="#cbd4dc" stroke-width="2"/><rect x="557" y="703" width="271" height="171" fill="#fff" stroke="#aebbc6" stroke-width="2"/><path d="M647 703v171M738 703v171M557 789h271" stroke="#dce2e7" stroke-width="2"/><rect x="647" y="789" width="91" height="85" fill="#d8e9f8" stroke="#316b9b" stroke-width="3"/><text x="665" y="837" class="txt xs">Auswahl</text>
<text x="529" y="948" class="txt xs">Hallenmodell optional. Fläche später änderbar.</text><rect x="528" y="979" width="329" height="58" rx="9" fill="#316b9b"/><text x="630" y="1016" class="white s">Planung öffnen →</text>
