<rect x="94" y="530" width="327" height="124" rx="12" class="card"/><text x="115" y="565" class="txt h">Werkhalle Nord</text><text x="115" y="596" class="txt xs">Bereich B · gespeichert heute</text><rect x="115" y="612" width="118" height="29" rx="6" fill="#d8e9f8"/><text x="131" y="633" class="txt xs">Projekt öffnen →</text>
<rect x="94" y="672" width="327" height="124" rx="12" class="card"/><text x="115" y="707" class="txt h">Linie 4</text><text x="115" y="738" class="txt xs">Zuletzt geöffnet gestern</text><rect x="115" y="754" width="118" height="29" rx="6" fill="#d8e9f8"/><text x="131" y="775" class="txt xs">Fortsetzen →</text>
<text x="96" y="840" class="txt s">Deine Fachmodule</text><text x="115" y="877" class="txt xs">Mechanik · Elektrik · Kamera</text><text x="95" y="1018" class="txt xs">Navigation bleibt einfach und einspaltig.</text>
